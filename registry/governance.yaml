governance_version: "1.0"
ownership_model:
  platform_core:
    answers: What should exist and how should it connect?
    owns:
      - project registry
      - project identity
      - architecture roles
      - canonical status
      - lifecycle declarations
      - ownership declarations
      - project contracts
      - declared dependencies
      - compatibility rules
      - shared schemas
      - platform standards
      - design-system metadata
      - release metadata
      - integration contracts
      - planned extraction metadata
    must_not_become:
      - repository scanning engine
      - observed source-code intelligence
      - engineering evidence engine
      - ai reasoning engine
      - autonomous repository modification system
  neos:
    answers: What technically exists and what is true?
    owns:
      - observed engineering truth
      - repository scanning
      - architecture observation
      - source dependencies
      - drift detection
      - tests
      - firmware intelligence
      - engineering evidence
    must_not_become:
      - authoritative registry writer
      - conversational reasoning engine
      - uncontrolled release orchestrator
  gaia:
    answers: What does this mean and what should we do?
    owns:
      - reasoning
      - prioritisation
      - briefings
      - work-package preparation
      - approvals support
      - coordination
      - human-facing recommendations
    must_not_become:
      - authoritative registry writer
      - repository scanner
      - uncontrolled autonomous modifier
  command_centre:
    answers: Thin front door.
    owns:
      - discover
      - launch
      - navigate
      - observe
      - summarise
      - notify
      - orchestrate
    must_not_become:
      - domain application runtime
      - neos
      - gaia
  dashboard:
    answers: Visual operations, controls, permissions, status views, adapters and bridges.
    owns:
      - status views
      - permissions
      - adapters
      - bridges
    must_not_become:
      - permanent backend engine host
      - repository scanner
      - hidden orchestration layer

systems:
  - id: new-earth-platform-core
    canonical_name: New Earth Platform Core
