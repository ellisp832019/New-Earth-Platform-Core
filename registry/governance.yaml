      platform_core:
        kind: authoritative
        target: new-earth-platform-core
        notes: Root of the authoritative platform model.
      neos:
        kind: consumes_declarations
        target: neos
        notes: NEOS reads Platform Core declarations.
      gaia:
        kind: consumes_declarations
        target: gaia
        notes: Gaia explains Platform Core declarations.
      command_centre:
        kind: consumes_declarations
        target: command-centre
        notes: Command Centre presents the registry read model.
      dashboard:
        kind: not_applicable
        target: null
        notes: Dashboard is a future presentation layer, not a platform-core dependency.
    recommended_action: Maintain as the authoritative source of truth.
