  documentation: required

integrations:
  neos: true
  gaia: true
  command_centre: true

provides:
  - neos-status-api
  - neos-context-api
  - repository-intelligence
consumes:
  - platform-registry-v1

governance:
  owner_review: required
  architecture_review: required
  release_status: in-development
