name: Platform Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Platform validation
        run: new-earth-platform validate

      - name: Platform doctor
        run: new-earth-platform doctor

      - name: Platform read model smoke
        run: |
          new-earth-platform projects --json
          new-earth-platform compatibility --json

      - name: Tests
        run: pytest --cov=new_earth_platform --cov-report=term-missing

      - name: Generate architecture graph
        run: |
          mkdir -p artifacts/generated
          new-earth-platform graph --format mermaid --output artifacts/generated/platform.mmd

      - name: Upload generated graph
        uses: actions/upload-artifact@v4
        with:
          name: platform-graph
          path: artifacts/generated/platform.mmd
